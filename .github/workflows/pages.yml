name: Deploy website

# Publishes docs/ to GitHub Pages. Runs on any push that touches the site, and after the
# data workflows finish (their bot commits don't trigger push workflows on their own).
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows: ["Update earnings calls", "Request a company"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
